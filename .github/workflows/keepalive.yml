name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes, 24/7
  workflow_dispatch:          # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Moviq Backend
        run: |
          curl -s https://moviq.onrender.com/api/health
          echo "Backend pinged successfully"
